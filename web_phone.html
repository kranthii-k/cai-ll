<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Voice Agent</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin: 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            font-size: 1rem;
            color: #94a3b8;
            min-height: 1.5rem;
        }

        .call-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .call-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(34, 197, 94, 0.5);
        }

        .call-btn:active {
            transform: scale(0.95);
        }

        .call-btn.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Particles for AI speaking */
        .visualizer {
            display: flex;
            gap: 4px;
            height: 40px;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .visualizer.active {
            opacity: 1;
        }

        .bar {
            width: 6px;
            height: 8px;
            background: #38bdf8;
            border-radius: 3px;
            animation: bounce 0.5s ease-in-out infinite alternate;
        }

        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes bounce {
            from { height: 8px; }
            to { height: 40px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Voice Agent</h1>
        
        <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <button class="call-btn" id="callBtn">CALL</button>
        <div class="status" id="status">Tap to call</div>
    </div>

    <script>
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        
        const callBtn = document.getElementById('callBtn');
        const statusEl = document.getElementById('status');
        const visualizer = document.getElementById('visualizer');

        // Target sample rate for the backend (Whisper/VAD expects 16kHz)
        const TARGET_SAMPLE_RATE = 16000;

        async function startCall() {
            try {
                statusEl.innerText = "Requesting microphone...";
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TARGET_SAMPLE_RATE });
                
                // Construct WebSocket URL dynamically based on current host
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/web_stream`;
                
                statusEl.innerText = "Connecting...";
                ws = new WebSocket(wsUrl);
                ws.binaryType = "arraybuffer";

                ws.onopen = () => {
                    statusEl.innerText = "Connected! Start talking.";
                    callBtn.innerText = "END";
                    callBtn.classList.add('active');
                    
                    // Capture Mic
                    const source = audioContext.createMediaStreamSource(mediaStream);
                    // Use ScriptProcessor (deprecated but works reliably everywhere without separate files)
                    processor = audioContext.createScriptProcessor(4096, 1, 1);
                    
                    source.connect(processor);
                    processor.connect(audioContext.destination);
                    
                    processor.onaudioprocess = (e) => {
                        if (ws.readyState === WebSocket.OPEN) {
                            const float32Data = e.inputBuffer.getChannelData(0);
                            // Convert float32 to int16 for the backend
                            const int16Data = new Int16Array(float32Data.length);
                            for (let i = 0; i < float32Data.length; i++) {
                                int16Data[i] = Math.max(-32768, Math.min(32767, float32Data[i] * 32768));
                            }
                            ws.send(int16Data.buffer);
                        }
                    };
                };

                ws.onmessage = async (event) => {
                    if (typeof event.data === "string") {
                        const msg = JSON.parse(event.data);
                        if (msg.event === "tts_start") {
                            visualizer.classList.add('active');
                        } else if (msg.event === "tts_stop") {
                            visualizer.classList.remove('active');
                        }
                        return;
                    }

                    // Received binary audio from server (Int16 PCM at 24000Hz)
                    const int16Array = new Int16Array(event.data);
                    const float32Array = new Float32Array(int16Array.length);
                    for (let i = 0; i < int16Array.length; i++) {
                        float32Array[i] = int16Array[i] / 32768.0;
                    }

                    // The server sends 24000Hz audio. 
                    // We create a buffer and play it.
                    const buffer = audioContext.createBuffer(1, float32Array.length, 24000);
                    buffer.copyToChannel(float32Array, 0);

                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioContext.destination);
                    source.start();
                };

                ws.onclose = () => {
                    endCall();
                };

                ws.onerror = (e) => {
                    console.error(e);
                    statusEl.innerText = "Connection error.";
                    endCall();
                };

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Microphone access denied or error.";
            }
        }

        function endCall() {
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (ws) {
                ws.close();
                ws = null;
            }
            
            callBtn.innerText = "CALL";
            callBtn.classList.remove('active');
            visualizer.classList.remove('active');
            statusEl.innerText = "Call ended. Tap to call again.";
        }

        callBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                endCall();
            } else {
                startCall();
            }
        });
    </script>
</body>
</html>
